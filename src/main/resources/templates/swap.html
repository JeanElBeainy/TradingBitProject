<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/commonFiles/normalize.css">
    <link rel="stylesheet" href="/commonFiles/header.css">
    <link rel="stylesheet" href="/commonFiles/footer.css">
    <link rel="stylesheet" href="/swap/swap.css">
    <title>Swap</title>
</head>

<body>
<header class="header">
    <nav class="nav collapsible">
        <a class="nav__brand" href="">
            <img src="/images/TradingBitLogo.webp" alt="TradingBit Logo">
        </a>
        <svg class="nav__toggler" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
        </svg>
        <ul class="collapsible__content nav__list">
            <li class="nav__item"><a href="#">Dashboard</a></li>
            <li class="nav__item"><a href="#">Account Overview</a></li>
            <li class="nav__item"><a href="#">Sign Out</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="swap__section">
        <form id="swappingForm" method="post" th:object="${swap}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="swap__box">
                <div class="from__text">
                    <p>From</p>
                </div>

                <div class="swap__from">
                    <input type="hidden" th:field="*{from}">
                    <input type="text" id="cryptoSearch" class="swap__input" placeholder="Search your portfolio">

                    <div class="error__field" th:if="${#fields.hasErrors('from')}">
                        <p
                           th:errorclass="text-danger"
                           th:errors="*{from}">
                        </p>

                        <button type="button"
                                onclick="this.parentElement.style.display='none'"
                                style="background: none; border: none; color: white; font-size: 2rem; cursor: pointer; margin-left: 10px;">
                            &times;
                        </button>
                    </div>

                    <div class="error__field"
                         th:if="${#fields.hasErrors('quantity')}">
                        <p th:errorclass="text-danger"
                           th:errors="*{quantity}">
                        </p>

                        <button type="button"
                                onclick="this.parentElement.style.display='none'"
                                style="background: none; border: none; color: white; font-size: 2rem; cursor: pointer; margin-left: 10px;">
                            &times;
                        </button>
                    </div>


                    <div id="dropdownList" class="dropdown-list">
                        <div th:each="item : ${userItems}"
                             class="dropdown-item"
                             th:data-symbol="${item.symbol}"
                             th:data-name="${item.name}"
                             th:data-quantity="${item.quantity}">
                            <div class="item-info">
                                <span class="item-name" th:text="${item.name}"></span>
                                <span class="item-symbol" th:text="'(' + ${item.symbol} + ')'"></span>
                            </div>
                            <div class="item-details">
                                <span class="quantity" th:text="'Qty: ' + ${#numbers.formatDecimal(item.quantity, 0, 'COMMA', 8, 'POINT')}"></span>
                                <span class="type" th:text="${item.purchaseType}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="quantitySection" style="display: none;">
                    <div class="quantity__number">
                        Quantity: <span id="maxFromQuantity"></span>
                    </div>
                    <div class="from__text"><p>Amount</p></div>
                    <input th:field="*{quantity}" id="quantityInput" class="swap__input" placeholder="0.0" step="0.00000001">
                    <div class="quantity__buttons">
                        <button type="button" class="btn-percent" data-percent="0.25">25%</button>
                        <button type="button" class="btn-percent" data-percent="0.50">50%</button>
                        <button type="button" class="btn-percent" data-percent="0.75">75%</button>
                        <button type="button" class="btn-percent" data-percent="1">100%</button>
                    </div>
                </div>

                <div class="swap__arrow__line">
                    <div class="line">
                        <img src="/images/down-arrow.svg" alt="down-arrow">
                    </div>
                </div>

                <div class="to__text">
                    <p>To</p>
                </div>

                <div class="swap__to">
                    <input type="hidden" th:field="*{to}">
                    <input type="text" id="cryptoSearchTo" class="swap__input" placeholder="Swap to ...">
                    <div class="error__field" th:if="${#fields.hasErrors('to')}">
                        <p
                           th:errorclass="text-danger"
                           th:errors="*{to}">
                        </p>
                        <button type="button"
                                onclick="this.parentElement.style.display='none'"
                                style="background: none; border: none; color: white; font-size: 2rem; cursor: pointer; margin-left: 10px;">
                            &times;
                        </button>
                    </div>
                    <div id="dropdownListTo" class="dropdown-list">
                        <div th:each="swapTo : ${swapItems}"
                             class="dropdown-item"
                             th:data-symbol="${swapTo.symbol}"
                             th:data-name="${swapTo.name}">
                            <div class="item-info">
                                <span class="item-name" th:text="${swapTo.name}"></span>
                                <span class="item-symbol" th:text="'(' + ${swapTo.symbol} + ')'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="info__container">
                </div>

                <button type="submit" class="swap__button" onclick="startSpinning(this)">
                    <img src="/images/swap-icon.svg" alt="" class="swap__icon">
                    <p>Swap</p>
                </button>

                <div class="success__content" th:if="${success}">

                    <div class="success__message" th:field="${successfulSwap}">
                        <p>Swap successful!</p>
                        <p>Pair: <span th:text="${successfulSwap.fromSymbol}"></span> -> <span th:text="${successfulSwap.toSymbol}"></span></p>
                        <p>Quantity: <span th:text="${successfulSwap.fromQuantity}"></span>
                            ->
                            <span th:text="${successfulSwap.toQuantity}"></span></p>
                        <p>Fee: <span th:text="${successfulSwap.fee}"></span> in <span th:text="${successfulSwap.toSymbol}"></span></p>
                    </div>
                    <div>
                        <button type="button"
                                onclick="this.parentElement.parentElement.style.display='none'">
                            &times;
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </section>

    <section class="history__section">
        <div class="history__box">
            <div class="history__text">
                <p>Swap History</p>
            </div>
            <div th:if="${history.isEmpty()}">You do not have any swapping history.</div>
            <div class="swap__history" th:each="historyItem : ${history}">
                <div class="pair">Pair:
                    <span th:text="${historyItem.fromSymbol}"></span>
                    ->
                    <span th:text="${historyItem.toSymbol}"></span>
                </div>
                <div class="quantity">Quantity:
                    <span th:text="${historyItem.fromQuantity}"></span>
                    ->
                    <span th:text="${historyItem.toQuantity}"></span>
                </div>
                <div class="fee">Fees: <span th:text="${historyItem.fee}"></span>
                    <span th:text="${historyItem.toSymbol}"></span>
                </div>
            </div>
            <div class="more__history">
                <a href="">View more in detail</a>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer__top">
            <a class="footer__brand footer__item" href="#"><img src="/images/TradingBitLogo.webp" alt="TradingBit Logo"></a>
            <div class="footer__links footer__item">
                <a href="#">FAQ</a>
                <a href="#">Help</a>
                <a href="#">Disclaimer</a>
            </div>
            <div class="footer__socials footer__item">
                <a href="https://github.com" aria-label="GitHub" class="social-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
                <a href="https://www.linkedin.com" aria-label="LinkedIn" class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 1 1 8.25 6.5 1.75 1.75 0 0 1 6.5 8.25zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.64 1.64 0 0 0 13 14.19a1.65 1.65 0 0 0 .05 1.56V19h-3v-9h2.9v1.3a3.11 3.11 0 0 1 2.7-1.4c1.55 0 3.35 1 3.35 3.66z"/></svg></a>
            </div>
        </div>
        <div class="footer__text">
            <span>&copy; 2025 TradingBit. All Rights Reserved.</span>
        </div>
    </div>
</footer>

<script src="/swap/dropdownList.js"></script>
<script src="/commonFiles/collapsible.js"></script>
<script src="/swap/swapSpin.js"></script>

</body>
</html>
