<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/commonFiles/normalize.css">
    <link rel="stylesheet" href="/commonFiles/header.css">
    <link rel="stylesheet" href="/commonFiles/footer.css">
    <link rel="stylesheet" href="/dashboard/dashboard.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <title>Dashboard</title>
</head>
<body>
<header class="header">
    <nav class="nav collapsible">
        <a class="nav__brand" href="">
            <img src="/images/TradingBitLogo.webp" alt="TradingBit Logo">
        </a>
        <svg class="nav__toggler" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
        </svg>
        <ul class="collapsible__content nav__list">
            <li class="nav__item"><a href="#">Account Overview</a></li>
            <li class="nav__item"><a href="#">Sign Out</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="top__section">
        <div class="top__div">
            <div class="top__container">
                <div class="user__info" th:object="${userDashboardDto}">
                    <h1>Welcome, <span th:text="*{name}"></span></h1>
                    <p>USD balance: <span th:text="*{usdBalance}">null</span></p>
                    <p>Crypto balance: <span th:text="*{cryptoBalance}">null</span></p>
                    <p>Stock balance: <span th:text="*{stockBalance}">null</span></p>
                    <p>Total balance: <span th:text="*{totalBalance}">null</span></p>
                </div>
            </div>
        </div>
    </section>

    <section>
        <!-- Search Bar -->
        <div class="search__container">
            <input type="text" id="cryptoSearch" placeholder="Search crypto..." onkeyup="filterTable()">
        </div>
    </section>

    <section>
        <p>Last updated at:
            <span id="last-updated"
                  hx-get="/dashboard/last-updated"
                  hx-trigger="every 60s"
                  hx-swap="innerHTML">
                <th:block th:fragment="last-updated">
                    <span th:text="${lastUpdated}"></span>
                </th:block>
            </span>
        </p>


    </section>

    <section class="table__section">
        <div class="top__div">
            <table>
                <thead>
                <tr>
                    <th>Icon</th>
                    <th>Name</th>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>Market Cap</th>
                    <th>Volume (24h)</th>
                    <th>Change (24h)</th>
                    <th>Circulating Supply</th>
                    <th>Max Supply</th>
                </tr>
                </thead>
                <tbody
                        id="crypto-table-body"
                        hx-get="/dashboard/update-table"
                        hx-trigger="every 60s"
                        hx-swap="innerHTML"
                >
                <th:block th:fragment="crypto-table-body">
                    <tr th:each="crypto : ${cryptos}"
                        th:onclick="'window.location.href=\'' + @{/swap/{name}(name=${crypto.symbol})} + '\';'"
                    >
                        <td><img th:src="'https://s2.coinmarketcap.com/static/img/coins/32x32/' + ${crypto.id} + '.png'"
                                 th:alt="${crypto.name + ' logo'}"
                                 width="24" height="24"
                                 class="me-2"></td>
                        <td th:text="${crypto.name}"></td>
                        <td th:text="${crypto.symbol}"></td>
                        <td>
                     <span th:if="${crypto.price >= 1}"
                           th:text="'$' + ${#numbers.formatDecimal(crypto.price, 1, 'COMMA', 2, 'POINT')}"></span>
                            <span th:if="${crypto.price < 1 and crypto.price >= 0.001}"
                                  th:text="'$' + ${#numbers.formatDecimal(crypto.price, 1, 3)}"></span>
                            <span th:if="${crypto.price < 0.001}"
                                  th:text="'$' + ${#numbers.formatDecimal(crypto.price, 1, 8)}"></span>
                        </td>
                        <td th:text="'$' + ${#numbers.formatDecimal(crypto.marketCap, 1, 'COMMA', 0, 'POINT')}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(crypto.volume24h, 1, 'COMMA', 0, 'POINT')}"></td>
                        <td th:class="${crypto.percentChange24h >= 0} ? 'text-success' : 'text-danger'">
                        <span th:if="${crypto.percentChange24h >= 0}"
                              th:text="'+' + ${#numbers.formatDecimal(crypto.percentChange24h, 1, 2)} + '%'"></span>
                            <span th:unless="${crypto.percentChange24h >= 0}"
                                  th:text="${#numbers.formatDecimal(crypto.percentChange24h, 1, 2)} + '%'"></span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(crypto.circulatingSupply, 1, 'COMMA', 0, 'POINT')}"></td>
                        <td>
                        <span th:if="${crypto.maxSupply != null}"
                              th:text="${#numbers.formatDecimal(crypto.maxSupply, 1, 'COMMA', 0, 'POINT')}"></span>
                            <span th:unless="${crypto.maxSupply != null}">∞</span>
                        </td>
                    </tr>
                </th:block>

                </tbody>

            </table>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer__top">
            <a class="footer__brand footer__item" href="#"><img src="/images/TradingBitLogo.webp" alt="TradingBit Logo"></a>
            <div class="footer__links footer__item">
                <a href="#">FAQ</a>
                <a href="#">Help</a>
                <a href="#">Disclaimer</a>
            </div>
            <div class="footer__socials footer__item">
                <a href="https://github.com" aria-label="GitHub" class="social-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
                <a href="https://www.linkedin.com" aria-label="LinkedIn" class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 1 1 8.25 6.5 1.75 1.75 0 0 1 6.5 8.25zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.64 1.64 0 0 0 13 14.19a1.65 1.65 0 0 0 .05 1.56V19h-3v-9h2.9v1.3a3.11 3.11 0 0 1 2.7-1.4c1.55 0 3.35 1 3.35 3.66z"/></svg></a>
            </div>
        </div>
        <div class="footer__text">
            <span>&copy; 2025 TradingBit. All Rights Reserved.</span>
        </div>
    </div>
</footer>

<script src="/commonFiles/collapsible.js"></script>
<script src="/dashboard/search.js"></script>
</body>
</html>
