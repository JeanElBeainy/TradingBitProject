<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/signup/signup.css">
    <link rel="stylesheet" href="/commonFiles/normalize.css">
    <title>Sign Up</title>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>SIGN UP</h1>
    </div>

    <form id="signupForm" method="post" th:object="${registerDto}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label for="name">Username</label>
            <input th:field="*{name}" type="name" id="name" name="name" placeholder="Enter your username">
            <p th:if="${#fields.hasErrors('name')}"
               th:errorclass="text-danger"
               th:errors="${registerDto.name}"></p>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input th:field="*{email}" type="email" id="email" name="email" placeholder="Enter your email" required>
            <p th:if="${#fields.hasErrors('email')}"
               th:errorclass="text-danger"
               th:errors="${registerDto.email}"></p>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input th:field="*{password}" type="password" id="password" name="password" placeholder="Create a password" required>
            <p th:if="${#fields.hasErrors('password')}"
               th:errorclass="text-danger"
               th:errors="${registerDto.password}"></p>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input th:field="*{confirmPassword}" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            <p th:if="${#fields.hasErrors('confirmPassword')}"
               th:errorclass="text-danger"
               th:errors="${registerDto.confirmPassword}"></p>
        </div>

        <div class="note">
            <p>NOTE: We highly suggest that you use a unique password that you are not using anywhere.</p>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="#" target="_blank">Terms & Conditions</a></label>
        </div>

        <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <div class="login-link">
        <p>Already have an account? <a href="/login">Sign In</a></p>
    </div>
</div>

<canvas id="financial-icons"></canvas>
<script src="/commonFiles/floatingIconBackground.js"></script>

</body>
</html>
