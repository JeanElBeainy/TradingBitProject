<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/signup/signup.css">
    <link rel="stylesheet" href="/commonFiles/normalize.css">
    <script src="/commonFiles/floatingIconBackground.js"></script>
    <title>TradingBit | Sign Up</title>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>SIGN UP</h1>
    </div>

    <div th:if="${success}" class="signup__success">
        <strong>Registration successful!</strong>
        <a href="/login">Login</a>
        <button type="button" class="close__button"
                onclick="this.parentElement.style.display='none'">
            &times;
        </button>
    </div>

    <form id="signupForm" method="post" th:object="${registerDto}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label for="name">Username</label>
            <input th:field="*{name}" type="name" id="name" name="name" placeholder="Enter your username">
            <div th:if="${#fields.hasErrors('name')}" class="error__field">
                <span th:errors="${registerDto.name}"></span>
                <button type="button" class="close__button" style="left: 93%" onclick="this.parentElement.style.display='none'">
                    &times;
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input th:field="*{email}" type="email" id="email" name="email" placeholder="Enter your email" required>
            <div th:if="${#fields.hasErrors('email')}" class="error__field">
                <span th:errors="${registerDto.email}"></span>
                <button type="button" class="close__button" style="left: 93%" onclick="this.parentElement.style.display='none'">
                    &times;
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input th:field="*{password}" type="password" id="password" name="password" placeholder="Create a password" required>
            <div th:if="${#fields.hasErrors('password')}" class="error__field">
                <span th:errors="${registerDto.password}"></span>
                <button type="button" class="close__button" style="left: 93%" onclick="this.parentElement.style.display='none'">
                    &times;
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input th:field="*{confirmPassword}" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            <div th:if="${#fields.hasErrors('confirmPassword')}" class="error__field">
                <span th:errors="${registerDto.confirmPassword}"></span>
                <button type="button" class="close__button" style="left: 93%" onclick="this.parentElement.style.display='none'">
                    &times;
                </button>
            </div>
        </div>

        <div class="note">
            <p>NOTE: We highly suggest that you use a unique password that you are not using anywhere.</p>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I have read the <a href="#" target="_blank">disclaimer</a> page</label>
        </div>

        <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <div class="login-link">
        <p>Already have an account? <a href="/login">Sign In</a></p>
    </div>
</div>
<canvas id="financial-icons"></canvas>
</body>
</html>
