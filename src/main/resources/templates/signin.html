<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/commonFiles/normalize.css">
    <link rel="stylesheet" href="/signin/signin.css">
    <script src="/commonFiles/floatingIconBackground.js"></script>
    <title>TradingBit | Sign in</title>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>SIGN IN</h1>
    </div>

    <form th:action="@{/login}" id="signupForm" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>

        <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <div class="login-link">
        <p>Don't have an account? <a href="/signup">Sign Up</a></p>
    </div>
</div>
<canvas id="financial-icons"></canvas>
</body>
</html>
