<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/commonFiles/normalize.css">
    <link rel="stylesheet" href="/signin/signin.css">
    <title>Sign in</title>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>SIGN IN</h1>
    </div>

    <form id="signupForm" method="post" th:object="${loginDto}">

        <div class="form-group">
            <label for="email">Email</label>
            <input th:field="${loginDto.email}" type="email" id="email" name="email" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input th:field="${loginDto.password}" type="password" id="password" name="password" placeholder="Create a password" required>
        </div>

        <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <div class="login-link">
        <p>Don't have an account? <a href="signup">Sign Up</a></p>
    </div>
</div>

</body>
</html>
