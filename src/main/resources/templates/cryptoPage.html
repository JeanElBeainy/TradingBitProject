<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|${#strings.capitalize(symbol)} Raw Data (Last ${days} Days)|">Crypto Data</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f9;
            color: #333;
        }
        .container {
            max-width: 960px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden; /* Contains the table border radius */
        }
        h1 {
            text-align: center;
            padding: 20px 0;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }
        thead tr {
            background-color: #4a5568;
            color: #ffffff;
        }
        tbody tr:nth-of-type(even) {
            background-color: #f8f9fa;
        }
        tbody tr:hover {
            background-color: #e9ecef;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 th:text="|${#strings.capitalize(symbol)} Market Data (Last ${days} Days)|">Market Data</h1>

    <div>
        <table>
            <thead>
            <tr>
                <th>Date & Time</th>
                <th>Price (USD)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="point : ${chart}">
                <td th:text="${#dates.format(point.date, 'MMM dd, yyyy HH:mm')}"></td>
                <td th:text="${#numbers.formatCurrency(point.price)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
